name: workflow-ci

on:
  push:
    branches: [ "main" ]
    paths: ['notes-api/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [ "main" ]
    paths: ['notes-api/**', '.github/workflows/ci.yml']
  

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-api  
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: '**/pom.xml'
    - name: Build with Maven
      run: mvn -B verify 
